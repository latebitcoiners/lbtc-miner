name: Build macOS Miner
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests ecdsa cryptography pillow pycryptodome
      - name: Compile dylib
        run: |
          cd native
          clang -O3 -dynamiclib -arch x86_64 -arch arm64 lbtc_scan.c -o lbtc_scan.dylib
          file lbtc_scan.dylib
      - name: Build app
        run: |
          pyinstaller --onefile --windowed --name "LBTC_Wallet_Miner_v54.4" \
            --add-binary "native/lbtc_scan.dylib:." \
            --hidden-import miner_worker \
            --collect-submodules cryptography \
            --collect-submodules ecdsa \
            --noconfirm LBTC_Wallet_Miner_v54.py
      - name: Package
        run: |
          cd dist
          mkdir -p LBTC-Wallet-Miner-macOS-v54.4
          cp LBTC_Wallet_Miner_v54.4 LBTC-Wallet-Miner-macOS-v54.4/
          chmod +x LBTC-Wallet-Miner-macOS-v54.4/LBTC_Wallet_Miner_v54.4
          cat > LBTC-Wallet-Miner-macOS-v54.4/README.txt << 'RD'
          LBTC Wallet Miner v54.4 - macOS

          First launch:
            Right-click the binary -> Open (not double-click)
            Click "Open" when macOS warns "unidentified developer"

          Or from Terminal:
            chmod +x LBTC_Wallet_Miner_v54.4
            ./LBTC_Wallet_Miner_v54.4
          RD
          tar czf LBTC-Wallet-Miner-macOS-v54.4.tar.gz LBTC-Wallet-Miner-macOS-v54.4/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-miner
          path: dist/LBTC-Wallet-Miner-macOS-v54.4.tar.gz
