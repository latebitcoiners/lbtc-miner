name: Build LBTC-PRO for Mac + Linux
# Push a tag like v69 (or press "Run workflow") -> builds 4 downloads, tests each one, and makes a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04        # Intel/AMD 64-bit PCs
          - runner: ubuntu-24.04-arm    # ARM64 (Raspberry Pi 4/5 64-bit, ARM laptops)
    runs-on: ${{ matrix.runner }}
    # Debian 11 base = glibc 2.31, so the build runs on Ubuntu 20.04+ / Debian 11+ / Fedora / Mint / Arch
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Build + self-test
        run: PYTHON=python bash packaging/build.sh
      - name: Installer test (fresh user)
        run: |
          useradd -m tester
          mkdir /tmp/t && tar -xzf release/*.tar.gz -C /tmp/t && chmod -R a+rx /tmp/t
          su tester -c "cd /tmp/t/LBTC-PRO && ./install.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: release/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14            # Apple Silicon (M1-M4)
          - runner: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12 from python.org (includes Tk, runs on macOS 10.13+)
        run: |
          curl -fsSL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          /usr/local/bin/python3.12 -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Build + self-test
        run: |
          /usr/local/bin/python3.12 -m venv venv
          PYTHON=$PWD/venv/bin/python bash packaging/build.sh
      - name: Installer test (unpack zip like a user)
        run: |
          mkdir -p ~/Applications/t && ditto -x -k release/*.zip ~/Applications/t
          ~/Applications/t/LBTC-PRO.app/Contents/MacOS/LBTC-PRO --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: release/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Add installers + checksums
        run: |
          cp packaging/install-linux.sh packaging/install-mac.sh packaging/README-INSTALL.txt out/
          cd out && cat *.sha256 > SHA256SUMS.txt && rm *.sha256 && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: LBTC-PRO ${{ github.ref_name }} - Mac + Linux
          files: out/*
          body: |
            **Linux:** `curl -fsSL https://raw.githubusercontent.com/latebitcoiners/lbtc-miner/main/packaging/install-linux.sh | bash`
            **macOS:** `curl -fsSL https://raw.githubusercontent.com/latebitcoiners/lbtc-miner/main/packaging/install-mac.sh | bash`
            Or download the file for your system below. See README-INSTALL.txt.
